<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 반 수 규칙 발표판</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --bg-color: #fffdf7;
      --grid-dot: #eadfce;
      --text-main: #1e293b;
      --text-sub: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --success-soft: #f0fdf4;
      --retry: #ea580c;
      --retry-soft: #fff7ed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(var(--grid-dot) 1.8px, transparent 1.8px);
      background-size: 26px 26px;
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 28px;
      gap: 16px;
    }

    /* 상단 제목 및 결과 보기 영역 */
    header {
      width: 100%;
      max-width: 1120px;
      background: linear-gradient(135deg, #fffbeb 0%, #eff6ff 50%, #fdf2f8 100%);
      padding: 16px 24px;
      border-radius: 24px;
      border: 3px solid #fde68a;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
    }

    .title-area h1 {
      font-size: clamp(1.45rem, 2.6vw, 1.95rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-badge {
      background: #fef08a;
      color: #854d0e;
      font-size: 0.9rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      border: 2px solid #facc15;
    }

    .title-area p {
      margin-top: 5px;
      font-size: clamp(0.95rem, 1.5vw, 1.1rem);
      color: var(--text-sub);
      font-weight: 600;
    }

    /* 상단 결과 보기 버튼 */
    .btn-history-open {
      background: #ffffff;
      color: #1e293b;
      border: 3px solid #f59e0b;
      border-bottom-width: 6px;
      border-radius: 20px;
      padding: 12px 20px;
      font-size: clamp(1.05rem, 1.7vw, 1.22rem);
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 14px rgba(245, 158, 11, 0.16);
      transition: transform 0.12s ease, background-color 0.12s ease;
      white-space: nowrap;
    }

    .btn-history-open:hover {
      background: #fffbeb;
      transform: translateY(-2px);
    }

    .btn-history-open:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    .history-count-badge {
      background: #f59e0b;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 900;
      padding: 3px 11px;
      border-radius: 999px;
      min-width: 32px;
      text-align: center;
    }

    /* 중앙: 6개 숫자 카드 (한 줄 유지) */
    main {
      width: 100%;
      max-width: 1120px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .cards-wrapper {
      width: 100%;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.1vw, 14px);
    }

    .card-group {
      flex: 1;
      min-width: 0;
      max-width: 158px;
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.1vw, 14px);
    }

    .card-group.last-group {
      flex: 0.88;
      max-width: 138px;
    }

    .arrow-sep {
      font-size: clamp(1.1rem, 1.9vw, 1.7rem);
      color: #94a3b8;
      font-weight: 900;
      flex-shrink: 0;
    }

    .num-card {
      flex: 1;
      min-width: 0;
      height: clamp(118px, 17vw, 176px);
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      border-bottom-width: 8px;
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      box-shadow: 0 6px 14px rgba(15, 23, 42, 0.05);
    }

    /* 6개 카드 각각의 파스텔 컬러 */
    .num-card[data-color="0"] { border-color: #fda4af; background: #fff1f2; }
    .num-card[data-color="1"] { border-color: #fdba74; background: #fff7ed; }
    .num-card[data-color="2"] { border-color: #fde047; background: #fefce8; }
    .num-card[data-color="3"] { border-color: #86efac; background: #f0fdf4; }
    .num-card[data-color="4"] { border-color: #93c5fd; background: #eff6ff; }
    .num-card[data-color="5"] { border-color: #d8b4fe; background: #faf5ff; }

    .num-card[data-color="0"] .card-index { background: #ffe4e6; color: #be123c; }
    .num-card[data-color="1"] .card-index { background: #ffedd5; color: #c2410c; }
    .num-card[data-color="2"] .card-index { background: #fef9c3; color: #a16207; }
    .num-card[data-color="3"] .card-index { background: #dcfce7; color: #15803d; }
    .num-card[data-color="4"] .card-index { background: #dbeafe; color: #1d4ed8; }
    .num-card[data-color="5"] .card-index { background: #f3e8ff; color: #7e22ce; }

    .num-card.filled {
      background: #ffffff;
    }

    .num-card:hover {
      transform: translateY(-3px);
    }

    .num-card.active {
      background: #ffffff;
      border-color: #2563eb !important;
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.22), 0 0 0 4px rgba(147, 197, 253, 0.55);
      z-index: 2;
    }

    .card-index {
      position: absolute;
      top: 10px;
      left: 12px;
      font-size: clamp(0.75rem, 1.1vw, 0.88rem);
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .num-card.active .card-index {
      background: #2563eb !important;
      color: #ffffff !important;
    }

    .card-value {
      font-size: clamp(2.1rem, 4.8vw, 3.9rem);
      font-weight: 900;
      color: var(--text-main);
      line-height: 1;
      letter-spacing: -0.03em;
      margin-top: 10px;
    }

    .card-placeholder {
      font-size: clamp(1.8rem, 3.6vw, 2.8rem);
      font-weight: 800;
      color: #94a3b8;
      margin-top: 10px;
    }

    .num-card.active .card-placeholder {
      color: #3b82f6;
      animation: blink 1.1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* 빈칸 알림 메시지 */
    .helper-msg {
      min-height: 28px;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--retry);
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .helper-msg.show {
      opacity: 1;
    }

    /* 하단 조작부 */
    .bottom-controls {
      width: 100%;
      max-width: 1120px;
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-radius: 28px;
      padding: 18px 20px 22px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .keypad-row {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: clamp(6px, 1vw, 12px);
    }

    .key-btn {
      height: clamp(60px, 8vh, 76px);
      border-radius: 18px;
      border: 3px solid #cbd5e1;
      border-bottom-width: 6px;
      background: #f8fafc;
      color: var(--text-main);
      font-size: clamp(1.45rem, 2.5vw, 1.95rem);
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.08s ease, background-color 0.12s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .key-btn:nth-child(odd) {
      background: #f0f9ff;
      border-color: #bae6fd;
      color: #0369a1;
    }

    .key-btn:nth-child(even) {
      background: #fefce8;
      border-color: #fde047;
      color: #854d0e;
    }

    .key-btn:hover {
      filter: brightness(0.97);
      transform: translateY(-2px);
    }

    .key-btn:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    .action-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sub-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .act-btn {
      height: 58px;
      padding: 0 20px;
      border-radius: 18px;
      font-size: clamp(1rem, 1.6vw, 1.15rem);
      font-weight: 800;
      cursor: pointer;
      border: 3px solid transparent;
      border-bottom-width: 6px;
      transition: transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .act-btn:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    .btn-del {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #e11d48;
    }

    .btn-next {
      background: #ecfeff;
      border-color: #a5f3fc;
      color: #0e7490;
    }

    .btn-clear-all {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #475569;
    }

    .btn-complete {
      flex: 1;
      min-width: 220px;
      max-width: 380px;
      height: 62px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #ffffff;
      border: none;
      border-bottom: 6px solid #1e40af;
      border-radius: 20px;
      font-size: clamp(1.25rem, 2.1vw, 1.5rem);
      font-weight: 900;
      letter-spacing: -0.01em;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
      transition: transform 0.12s ease;
    }

    .btn-complete:hover {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      transform: translateY(-2px);
    }

    .btn-complete:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    .btn-complete:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    .num-card.checking {
      animation: bounceCard 0.45s ease;
    }

    @keyframes bounceCard {
      0%, 100% { transform: translateY(0); }
      45% { transform: translateY(-14px); }
    }

    /* 공통 모달 배경 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 개별 결과 모달 */
    .modal-box {
      width: 100%;
      max-width: 580px;
      background: #ffffff;
      border-radius: 32px;
      padding: 36px 28px 30px;
      text-align: center;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
      border: 4px solid #e2e8f0;
      animation: popUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes popUp {
      from { transform: scale(0.92) translateY(16px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-box.success {
      border-color: #4ade80;
    }

    .modal-box.retry {
      border-color: #fb923c;
    }

    .result-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.7rem;
    }

    .modal-box.success .result-icon {
      background: var(--success-soft);
      border: 3px solid #bbf7d0;
    }

    .modal-box.retry .result-icon {
      background: var(--retry-soft);
      border: 3px solid #fed7aa;
    }

    .result-title {
      font-size: clamp(1.65rem, 3vw, 2.15rem);
      font-weight: 900;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    .modal-box.success .result-title {
      color: var(--success);
    }

    .modal-box.retry .result-title {
      color: var(--retry);
    }

    .result-numbers {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .mini-num {
      background: #f8fafc;
      border: 2.5px solid #cbd5e1;
      border-radius: 14px;
      padding: 8px 15px;
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--text-main);
    }

    .result-desc {
      font-size: 1.15rem;
      font-weight: 800;
      padding: 16px 20px;
      border-radius: 18px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .modal-box.success .result-desc {
      background: var(--success-soft);
      color: #166534;
    }

    .modal-box.retry .result-desc {
      background: var(--retry-soft);
      color: #9a3412;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .modal-btn {
      padding: 15px 26px;
      border-radius: 18px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      border: none;
      transition: transform 0.1s ease;
    }

    .modal-btn:active {
      transform: translateY(2px);
    }

    .modal-btn.primary-success {
      background: var(--success);
      color: #ffffff;
      border-bottom: 5px solid #15803d;
    }

    .modal-btn.secondary {
      background: #f1f5f9;
      color: var(--text-main);
      border-bottom: 5px solid #cbd5e1;
    }

    .modal-btn.primary-retry {
      background: var(--retry);
      color: #ffffff;
      border-bottom: 5px solid #c2410c;
    }

    /* 전체 결과 보기 큰 모달 */
    .history-modal-box {
      width: 100%;
      max-width: 1040px;
      height: 88dvh;
      background: #fffdf9;
      border-radius: 32px;
      border: 4px solid #fbbf24;
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: popUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .history-header {
      padding: 20px 28px;
      background: linear-gradient(135deg, #fef3c7 0%, #eff6ff 100%);
      border-bottom: 3px solid #fde68a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .history-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .history-title-wrap h2 {
      font-size: clamp(1.45rem, 2.6vw, 2rem);
      font-weight: 900;
      color: var(--text-main);
    }

    .history-total-pill {
      background: #2563eb;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 900;
      padding: 5px 14px;
      border-radius: 999px;
    }

    .history-header-btns {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-history-clear {
      padding: 11px 16px;
      border-radius: 14px;
      border: 2px solid #fecdd3;
      border-bottom-width: 4px;
      background: #fff1f2;
      color: #e11d48;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-history-close {
      padding: 11px 22px;
      border-radius: 16px;
      border: none;
      border-bottom: 5px solid #1e293b;
      background: #334155;
      color: #ffffff;
      font-size: 1.08rem;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-history-close:active,
    .btn-history-clear:active {
      transform: translateY(2px);
    }

    .history-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .history-empty {
      margin: auto;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
    }

    .history-empty-icon {
      font-size: 4rem;
      margin-bottom: 14px;
    }

    .history-empty h3 {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .history-empty p {
      font-size: 1.12rem;
      font-weight: 600;
    }

    /* 결과 목록 개별 카드 */
    .history-item {
      background: #ffffff;
      border: 3px solid #e2e8f0;
      border-bottom-width: 6px;
      border-radius: 24px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
    }

    .history-item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .history-order-badge {
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 1.05rem;
      font-weight: 900;
      padding: 6px 14px;
      border-radius: 999px;
    }

    .btn-item-remove {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      color: #64748b;
      border-radius: 10px;
      padding: 4px 10px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-item-remove:hover {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #e11d48;
    }

    .history-seq-row {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1vw, 12px);
      flex-wrap: nowrap;
      overflow-x: auto;
      padding: 4px 0;
    }

    .history-num-box {
      flex: 1;
      min-width: 56px;
      max-width: 110px;
      height: 68px;
      border-radius: 18px;
      border: 3px solid #cbd5e1;
      border-bottom-width: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.5rem, 2.6vw, 2.1rem);
      font-weight: 900;
      color: var(--text-main);
      background: #ffffff;
    }

    .history-num-box[data-color="0"] { border-color: #fda4af; background: #fff1f2; }
    .history-num-box[data-color="1"] { border-color: #fdba74; background: #fff7ed; }
    .history-num-box[data-color="2"] { border-color: #fde047; background: #fefce8; }
    .history-num-box[data-color="3"] { border-color: #86efac; background: #f0fdf4; }
    .history-num-box[data-color="4"] { border-color: #93c5fd; background: #eff6ff; }
    .history-num-box[data-color="5"] { border-color: #d8b4fe; background: #faf5ff; }

    .history-arrow {
      font-size: 1.25rem;
      font-weight: 900;
      color: #94a3b8;
      flex-shrink: 0;
    }

    .history-rule-banner {
      background: #f0fdf4;
      border: 2.5px solid #86efac;
      color: #166534;
      border-radius: 16px;
      padding: 13px 18px;
      font-size: clamp(1.1rem, 1.8vw, 1.32rem);
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .confetti-piece {
      position: fixed;
      width: 11px;
      height: 15px;
      top: -20px;
      z-index: 150;
      border-radius: 3px;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0.9;
      }
    }

    @media (max-width: 760px) {
      .arrow-sep {
        display: none;
      }
      .card-group,
      .card-group.last-group {
        flex: 1;
        max-width: none;
      }
      .num-card {
        height: 108px;
        border-radius: 18px;
      }
      .card-index {
        top: 6px;
        left: 6px;
        padding: 2px 6px;
        font-size: 0.7rem;
      }
      .keypad-row {
        grid-template-columns: repeat(5, 1fr);
      }
      .action-bar {
        justify-content: center;
      }
      .btn-complete {
        width: 100%;
        max-width: none;
      }
      .history-body {
        padding: 16px;
      }
      .history-arrow {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>
        우리 반 수 규칙 발표판
        <span class="title-badge">0 ~ 99</span>
      </h1>
      <p>숫자 6개를 차례대로 적고 규칙을 설명한 뒤, 아래 <strong>[규칙 완성!]</strong> 버튼을 눌러 보세요.</p>
    </div>

    <button type="button" class="btn-history-open" id="btnOpenHistory">
      📋 결과 보기
      <span class="history-count-badge" id="historyCountBadge">0</span>
    </button>
  </header>

  <main>
    <section class="cards-wrapper" id="cardsContainer" aria-label="수 규칙 입력 칸"></section>
    <div class="helper-msg" id="helperMsg">빈칸에 0부터 99까지의 숫자를 모두 입력해 주세요!</div>
  </main>

  <section class="bottom-controls" aria-label="숫자 입력 및 실행 버튼">
    <div class="keypad-row">
      <button type="button" class="key-btn" data-num="1">1</button>
      <button type="button" class="key-btn" data-num="2">2</button>
      <button type="button" class="key-btn" data-num="3">3</button>
      <button type="button" class="key-btn" data-num="4">4</button>
      <button type="button" class="key-btn" data-num="5">5</button>
      <button type="button" class="key-btn" data-num="6">6</button>
      <button type="button" class="key-btn" data-num="7">7</button>
      <button type="button" class="key-btn" data-num="8">8</button>
      <button type="button" class="key-btn" data-num="9">9</button>
      <button type="button" class="key-btn" data-num="0">0</button>
    </div>

    <div class="action-bar">
      <div class="sub-actions">
        <button type="button" class="act-btn btn-del" id="btnBackspace">← 지우기</button>
        <button type="button" class="act-btn btn-next" id="btnNext">다음 칸 →</button>
        <button type="button" class="act-btn btn-clear-all" id="btnResetAll">모두 지우기</button>
      </div>

      <button type="button" class="btn-complete" id="btnComplete">✨ 규칙 완성!</button>
    </div>
  </section>

  <!-- 개별 판정 결과 모달 -->
  <div class="modal-backdrop" id="resultModal" role="dialog" aria-modal="true">
    <div class="modal-box" id="modalBox">
      <div class="result-icon" id="resultIcon">🎉</div>
      <h2 class="result-title" id="resultTitle">성공! 멋진 규칙이에요!</h2>
      <div class="result-numbers" id="resultNumbers"></div>
      <p class="result-desc" id="resultDesc"></p>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <!-- 지금까지 입력한 결과 모아보기 큰 화면 모달 -->
  <div class="modal-backdrop" id="historyModal" role="dialog" aria-modal="true">
    <div class="history-modal-box">
      <div class="history-header">
        <div class="history-title-wrap">
          <h2>🏆 우리 반이 만든 수 규칙 모음</h2>
          <span class="history-total-pill" id="historyModalTotal">총 0개</span>
        </div>
        <div class="history-header-btns">
          <button type="button" class="btn-history-clear" id="btnClearHistory">기록 모두 지우기</button>
          <button type="button" class="btn-history-close" id="btnCloseHistory">닫기 ✕</button>
        </div>
      </div>

      <div class="history-body" id="historyListBody"></div>
    </div>
  </div>

  <script>
    const TOTAL_SLOTS = 6;
    const STORAGE_KEY = 'class_number_patterns_v1';

    let values = Array(TOTAL_SLOTS).fill('');
    let activeIndex = 0;
    let replaceOnNextDigit = true;
    let isChecking = false;
    let historyRecords = loadHistory();

    const cardsContainer = document.getElementById('cardsContainer');
    const helperMsg = document.getElementById('helperMsg');
    const btnComplete = document.getElementById('btnComplete');
    const btnResetAll = document.getElementById('btnResetAll');
    const resultModal = document.getElementById('resultModal');
    const modalBox = document.getElementById('modalBox');
    const resultIcon = document.getElementById('resultIcon');
    const resultTitle = document.getElementById('resultTitle');
    const resultNumbers = document.getElementById('resultNumbers');
    const resultDesc = document.getElementById('resultDesc');
    const modalActions = document.getElementById('modalActions');

    const btnOpenHistory = document.getElementById('btnOpenHistory');
    const historyCountBadge = document.getElementById('historyCountBadge');
    const historyModal = document.getElementById('historyModal');
    const historyModalTotal = document.getElementById('historyModalTotal');
    const historyListBody = document.getElementById('historyListBody');
    const btnCloseHistory = document.getElementById('btnCloseHistory');
    const btnClearHistory = document.getElementById('btnClearHistory');

    function loadHistory() {
      try {
        const saved = sessionStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : [];
      } catch (e) {
        return [];
      }
    }

    function saveHistory() {
      try {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(historyRecords));
      } catch (e) {}
      updateHistoryBadge();
    }

    function updateHistoryBadge() {
      historyCountBadge.textContent = historyRecords.length;
      historyModalTotal.textContent = `총 ${historyRecords.length}개`;
    }

    function addHistoryRecord(nums, description) {
      // 방금 등록한 것과 완전히 같은 숫자 배열이면 중복 추가 방지
      if (historyRecords.length > 0) {
        const last = historyRecords[historyRecords.length - 1];
        if (JSON.stringify(last.nums) === JSON.stringify(nums)) {
          return;
        }
      }
      historyRecords.push({
        id: Date.now() + Math.random(),
        nums: [...nums],
        description
      });
      saveHistory();
    }

    function renderHistoryModal() {
      updateHistoryBadge();
      historyListBody.innerHTML = '';

      if (historyRecords.length === 0) {
        historyListBody.innerHTML = `
          <div class="history-empty">
            <div class="history-empty-icon">📝</div>
            <h3>아직 완성된 수 규칙이 없어요!</h3>
            <p>숫자 6개를 넣고 <strong>[✨ 규칙 완성!]</strong> 버튼을 누르면 이곳에 차곡차곡 모입니다.</p>
          </div>
        `;
        return;
      }

      historyRecords.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'history-item';

        const topRow = document.createElement('div');
        topRow.className = 'history-item-top';

        const orderBadge = document.createElement('span');
        orderBadge.className = 'history-order-badge';
        orderBadge.textContent = `${index + 1}번째 발표`;

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn-item-remove';
        delBtn.textContent = '삭제';
        delBtn.addEventListener('click', () => {
          historyRecords = historyRecords.filter(r => r.id !== item.id);
          saveHistory();
          renderHistoryModal();
        });

        topRow.appendChild(orderBadge);
        topRow.appendChild(delBtn);

        const seqRow = document.createElement('div');
        seqRow.className = 'history-seq-row';

        item.nums.forEach((num, idx) => {
          const box = document.createElement('div');
          box.className = 'history-num-box';
          box.dataset.color = idx;
          box.textContent = num;
          seqRow.appendChild(box);

          if (idx < item.nums.length - 1) {
            const arrow = document.createElement('span');
            arrow.className = 'history-arrow';
            arrow.textContent = '→';
            seqRow.appendChild(arrow);
          }
        });

        const ruleBanner = document.createElement('div');
        ruleBanner.className = 'history-rule-banner';
        ruleBanner.textContent = `✨ ${item.description}`;

        card.appendChild(topRow);
        card.appendChild(seqRow);
        card.appendChild(ruleBanner);
        historyListBody.appendChild(card);
      });
    }

    btnOpenHistory.addEventListener('click', () => {
      renderHistoryModal();
      historyModal.classList.add('open');
    });

    btnCloseHistory.addEventListener('click', () => {
      historyModal.classList.remove('open');
    });

    historyModal.addEventListener('click', (e) => {
      if (e.target === historyModal) {
        historyModal.classList.remove('open');
      }
    });

    btnClearHistory.addEventListener('click', () => {
      if (historyRecords.length === 0) return;
      historyRecords = [];
      saveHistory();
      renderHistoryModal();
    });

    function renderCards() {
      cardsContainer.innerHTML = '';
      for (let i = 0; i < TOTAL_SLOTS; i++) {
        const group = document.createElement('div');
        group.className = i === TOTAL_SLOTS - 1 ? 'card-group last-group' : 'card-group';

        const card = document.createElement('div');
        card.className = 'num-card';
        card.dataset.color = i;
        if (i === activeIndex) card.classList.add('active');
        if (values[i] !== '') card.classList.add('filled');
        card.dataset.index = i;

        const indexLabel = document.createElement('span');
        indexLabel.className = 'card-index';
        indexLabel.textContent = `${i + 1}번째`;

        const valueSpan = document.createElement('span');
        if (values[i] !== '') {
          valueSpan.className = 'card-value';
          valueSpan.textContent = values[i];
        } else {
          valueSpan.className = 'card-placeholder';
          valueSpan.textContent = '?';
        }

        card.appendChild(indexLabel);
        card.appendChild(valueSpan);

        card.addEventListener('click', () => {
          if (isChecking) return;
          activeIndex = i;
          replaceOnNextDigit = true;
          hideHelper();
          renderCards();
        });

        group.appendChild(card);

        if (i < TOTAL_SLOTS - 1) {
          const arrow = document.createElement('span');
          arrow.className = 'arrow-sep';
          arrow.textContent = '→';
          group.appendChild(arrow);
        }

        cardsContainer.appendChild(group);
      }
    }

    function showHelper(text) {
      helperMsg.textContent = text;
      helperMsg.classList.add('show');
    }

    function hideHelper() {
      helperMsg.classList.remove('show');
    }

    function inputDigit(digit) {
      if (isChecking || resultModal.classList.contains('open') || historyModal.classList.contains('open')) return;
      hideHelper();

      let current = values[activeIndex];

      if (replaceOnNextDigit || current === '') {
        values[activeIndex] = digit;
        replaceOnNextDigit = false;
      } else if (current === '0') {
        values[activeIndex] = digit;
      } else if (current.length < 2) {
        values[activeIndex] = current + digit;
      } else {
        showHelper('숫자는 0부터 99까지만 입력할 수 있어요!');
      }

      renderCards();
    }

    function handleBackspace() {
      if (isChecking || resultModal.classList.contains('open') || historyModal.classList.contains('open')) return;
      hideHelper();

      let current = values[activeIndex];
      if (current.length > 0) {
        values[activeIndex] = current.slice(0, -1);
        replaceOnNextDigit = false;
      } else if (activeIndex > 0) {
        activeIndex--;
        values[activeIndex] = values[activeIndex].slice(0, -1);
        replaceOnNextDigit = false;
      }
      renderCards();
    }

    function moveNext() {
      if (isChecking) return;
      hideHelper();
      if (activeIndex < TOTAL_SLOTS - 1) {
        activeIndex++;
        replaceOnNextDigit = true;
        renderCards();
      }
    }

    function movePrev() {
      if (isChecking) return;
      hideHelper();
      if (activeIndex > 0) {
        activeIndex--;
        replaceOnNextDigit = true;
        renderCards();
      }
    }

    document.querySelectorAll('.key-btn[data-num]').forEach(btn => {
      btn.addEventListener('click', () => {
        inputDigit(btn.dataset.num);
      });
    });

    document.getElementById('btnBackspace').addEventListener('click', handleBackspace);
    document.getElementById('btnNext').addEventListener('click', moveNext);

    document.addEventListener('keydown', (e) => {
      if (historyModal.classList.contains('open')) {
        if (e.key === 'Escape') historyModal.classList.remove('open');
        return;
      }
      if (resultModal.classList.contains('open')) {
        if (e.key === 'Escape') closeModal();
        return;
      }
      if (isChecking) return;

      if (e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        inputDigit(e.key);
      } else if (e.key === 'Backspace' || e.key === 'Delete') {
        e.preventDefault();
        handleBackspace();
      } else if (e.key === 'ArrowRight' || e.key === 'Tab') {
        e.preventDefault();
        moveNext();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        movePrev();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (activeIndex < TOTAL_SLOTS - 1 && values[activeIndex] !== '') {
          moveNext();
        }
      }
    });

    btnResetAll.addEventListener('click', () => {
      if (isChecking) return;
      values = Array(TOTAL_SLOTS).fill('');
      activeIndex = 0;
      replaceOnNextDigit = true;
      hideHelper();
      renderCards();
    });

    // 초등 수 규칙 종합 판별 함수
    function evaluatePattern(nums) {
      const [a0, a1, a2, a3, a4, a5] = nums;
      const diffs = [a1 - a0, a2 - a1, a3 - a2, a4 - a3, a5 - a4];

      // 1. 모두 같은 수 반복 (AAAAAA)
      if (diffs.every(d => d === 0)) {
        return {
          valid: true,
          description: `같은 수 '${a0}'이(가) 계속 반복되는 규칙이에요!`
        };
      }

      // 2. 일정한 수만큼 커지거나 작아지는 규칙 (ABCDEF 등차수열)
      if (diffs.every(d => d === diffs[0])) {
        const step = diffs[0];
        if (step > 0) {
          return {
            valid: true,
            description: `${step}씩 일정하게 커지는 규칙이에요!`
          };
        } else {
          return {
            valid: true,
            description: `${Math.abs(step)}씩 일정하게 작아지는 규칙이에요!`
          };
        }
      }

      // 3. ABAB 반복 (ABABAB)
      if (a0 === a2 && a2 === a4 && a1 === a3 && a3 === a5 && a0 !== a1) {
        return {
          valid: true,
          description: `'${a0}, ${a1}' 두 수가 차례대로 반복되는(ABAB) 규칙이에요!`
        };
      }

      // 4. AAB 반복 (AABAAB)
      if (a0 === a1 && a0 === a3 && a3 === a4 && a2 === a5 && a0 !== a2) {
        return {
          valid: true,
          description: `'${a0}, ${a0}, ${a2}' 모양(AAB)이 반복되는 규칙이에요!`
        };
      }

      // 5. ABB 반복 (ABBABB)
      if (a1 === a2 && a4 === a5 && a1 === a4 && a0 === a3 && a0 !== a1) {
        return {
          valid: true,
          description: `'${a0}, ${a1}, ${a1}' 모양(ABB)이 반복되는 규칙이에요!`
        };
      }

      // 6. ABC 반복 (ABCABC)
      if (a0 === a3 && a1 === a4 && a2 === a5) {
        return {
          valid: true,
          description: `'${a0}, ${a1}, ${a2}' 세 수가 차례대로 반복되는(ABC) 규칙이에요!`
        };
      }

      // 7. AAABBB 반복
      if (a0 === a1 && a1 === a2 && a3 === a4 && a4 === a5 && a0 !== a3) {
        return {
          valid: true,
          description: `'${a0}'이(가) 3번, '${a3}'이(가) 3번씩 나오는 규칙이에요!`
        };
      }

      // 8. AABBCC
      if (a0 === a1 && a2 === a3 && a4 === a5 && (a2 - a0 === a4 - a2) && a2 !== a0) {
        const step = a2 - a0;
        const dir = step > 0 ? `${step}씩 커지는` : `${Math.abs(step)}씩 작아지는`;
        return {
          valid: true,
          description: `같은 수가 두 번씩 나오면서 ${dir} 규칙이에요!`
        };
      }

      // 9. ABBCCC
      if (a1 === a2 && a3 === a4 && a4 === a5 && a0 !== a1 && a1 !== a3) {
        return {
          valid: true,
          description: `숫자가 1개, 2개, 3개씩 개수가 늘어나며 나오는 규칙이에요!`
        };
      }

      // 10. AAABBC
      if (a0 === a1 && a1 === a2 && a3 === a4 && a0 !== a3 && a3 !== a5) {
        return {
          valid: true,
          description: `숫자가 3개, 2개, 1개씩 개수가 줄어들며 나오는 규칙이에요!`
        };
      }

      // 11. ABCCBA (거울 대칭)
      if (a0 === a5 && a1 === a4 && a2 === a3) {
        return {
          valid: true,
          description: `앞뒤가 거울처럼 똑같이 대칭되는 규칙이에요!`
        };
      }

      // 12. 2개씩 묶음이 일정하게 변하는 규칙
      if ((a2 - a0 === a4 - a2) && (a3 - a1 === a5 - a3) && (a2 - a0 === a3 - a1) && a2 !== a0) {
        const step = a2 - a0;
        const dir = step > 0 ? `${step}씩 커지는` : `${Math.abs(step)}씩 작아지는`;
        return {
          valid: true,
          description: `두 수씩 묶어서 볼 때 ${dir} 규칙이에요!`
        };
      }

      // 13. 3개씩 묶음이 일정하게 변하는 규칙
      if ((a3 - a0 === a4 - a1) && (a4 - a1 === a5 - a2) && a3 !== a0) {
        const step = a3 - a0;
        const dir = step > 0 ? `${step}씩 커지는` : `${Math.abs(step)}씩 작아지는`;
        return {
          valid: true,
          description: `세 수씩 묶어서 볼 때 ${dir} 규칙이에요!`
        };
      }

      // 14. 일정한 배로 커지는 규칙
      if (a0 > 0 && a1 % a0 === 0) {
        const ratio = a1 / a0;
        if (
          ratio > 1 &&
          a2 === a1 * ratio &&
          a3 === a2 * ratio &&
          a4 === a3 * ratio &&
          a5 === a4 * ratio
        ) {
          return {
            valid: true,
            description: `${ratio}배씩 커지는 규칙이에요!`
          };
        }
      }

      // 15. 앞의 두 수를 더해서 다음 수가 되는 규칙
      if (
        a2 === a0 + a1 &&
        a3 === a1 + a2 &&
        a4 === a2 + a3 &&
        a5 === a3 + a4
      ) {
        return {
          valid: true,
          description: `앞의 두 수를 더해서 다음 수가 되는 규칙이에요!`
        };
      }

      // 16. 커지는 폭이 점점 커지거나 줄어드는 규칙
      const diffLabels = diffs.map(d => (d >= 0 ? `+${d}` : `${d}`)).join(', ');
      if (diffs[0] > 0 && diffs[0] < diffs[1] && diffs[1] < diffs[2] && diffs[2] < diffs[3] && diffs[3] < diffs[4]) {
        return {
          valid: true,
          description: `커지는 크기가 점점 더 커지는 규칙이에요! (${diffLabels})`
        };
      }
      if (diffs[4] > 0 && diffs[0] > diffs[1] && diffs[1] > diffs[2] && diffs[2] > diffs[3] && diffs[3] > diffs[4]) {
        return {
          valid: true,
          description: `커지는 크기가 점점 작아지는 규칙이에요! (${diffLabels})`
        };
      }

      // 17. 작아지는 폭이 점점 커지거나 줄어드는 규칙
      if (diffs[0] < 0 && diffs[0] > diffs[1] && diffs[1] > diffs[2] && diffs[2] > diffs[3] && diffs[3] > diffs[4]) {
        return {
          valid: true,
          description: `작아지는 크기가 점점 더 커지는 규칙이에요! (${diffLabels})`
        };
      }
      if (diffs[4] < 0 && diffs[0] < diffs[1] && diffs[1] < diffs[2] && diffs[2] < diffs[3] && diffs[3] < diffs[4]) {
        return {
          valid: true,
          description: `작아지는 크기가 점점 작아지는 규칙이에요! (${diffLabels})`
        };
      }

      // 18. 두 가지 변화가 번갈아 나타나는 규칙
      if (diffs[0] === diffs[2] && diffs[2] === diffs[4] && diffs[1] === diffs[3]) {
        const s1 = diffs[0] >= 0 ? `+${diffs[0]}` : `${diffs[0]}`;
        const s2 = diffs[1] >= 0 ? `+${diffs[1]}` : `${diffs[1]}`;
        return {
          valid: true,
          description: `'${s1}, ${s2}' 변화가 번갈아 나타나는 규칙이에요!`
        };
      }

      // 19. 홀수 번째 자리와 짝수 번째 자리가 각각 일정하게 변하는 경우
      if ((a2 - a0 === a4 - a2) && (a3 - a1 === a5 - a3)) {
        return {
          valid: true,
          description: `홀수 번째 자리와 짝수 번째 자리가 각각 일정하게 변하는 규칙이에요!`
        };
      }

      // 20. 십의 자리와 일의 자리를 바꾼 짝꿍 규칙
      const isSwappedPair = (x, y) => {
        if (x < 10 || y < 10) return false;
        const x10 = Math.floor(x / 10), x1 = x % 10;
        const y10 = Math.floor(y / 10), y1 = y % 10;
        return x10 !== x1 && x10 === y1 && x1 === y10;
      };
      if (isSwappedPair(a0, a1) && isSwappedPair(a2, a3) && isSwappedPair(a4, a5)) {
        return {
          valid: true,
          description: `십의 자리와 일의 자리 숫자를 서로 바꾼 짝꿍 규칙이에요!`
        };
      }

      // 21. 각 자리 숫자의 합이 모두 같은 규칙
      const digitSum = n => Math.floor(n / 10) + (n % 10);
      const targetSum = digitSum(a0);
      if (nums.every(n => digitSum(n) === targetSum)) {
        return {
          valid: true,
          description: `십의 자리와 일의 자리 숫자를 더하면 모두 ${targetSum}이(가) 되는 규칙이에요!`
        };
      }

      // 22. 차례대로 점점 커지는 규칙 (ABCDEF)
      if (a0 < a1 && a1 < a2 && a2 < a3 && a3 < a4 && a4 < a5) {
        return {
          valid: true,
          description: `숫자가 차례대로 점점 커지는 규칙이에요!`
        };
      }

      // 23. 차례대로 점점 작아지는 규칙
      if (a0 > a1 && a1 > a2 && a2 > a3 && a3 > a4 && a4 > a5) {
        return {
          valid: true,
          description: `숫자가 차례대로 점점 작아지는 규칙이에요!`
        };
      }

      return {
        valid: false,
        description: `6개의 숫자가 하나의 규칙으로 이어지는지 다시 한 번 살펴보세요!`
      };
    }

    function launchConfetti() {
      const colors = ['#f43f5e', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899'];
      for (let i = 0; i < 60; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (Math.random() * 1.6 + 1.4) + 's';
        piece.style.animationDelay = (Math.random() * 0.3) + 's';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 3300);
      }
    }

    function openResultModal(nums, result) {
      resultNumbers.innerHTML = '';
      nums.forEach(n => {
        const badge = document.createElement('span');
        badge.className = 'mini-num';
        badge.textContent = n;
        resultNumbers.appendChild(badge);
      });

      modalBox.classList.remove('success', 'retry');
      modalActions.innerHTML = '';

      if (result.valid) {
        addHistoryRecord(nums, result.description);

        modalBox.classList.add('success');
        resultIcon.textContent = '🎉';
        resultTitle.textContent = '성공! 멋진 규칙이에요!';
        resultDesc.textContent = result.description;

        const btnNew = document.createElement('button');
        btnNew.className = 'modal-btn primary-success';
        btnNew.textContent = '새 규칙 만들기';
        btnNew.addEventListener('click', () => {
          closeModal();
          values = Array(TOTAL_SLOTS).fill('');
          activeIndex = 0;
          replaceOnNextDigit = true;
          renderCards();
        });

        const btnViewAll = document.createElement('button');
        btnViewAll.className = 'modal-btn secondary';
        btnViewAll.textContent = '📋 결과 보기';
        btnViewAll.addEventListener('click', () => {
          closeModal();
          renderHistoryModal();
          historyModal.classList.add('open');
        });

        const btnStay = document.createElement('button');
        btnStay.className = 'modal-btn secondary';
        btnStay.textContent = '화면 계속 보기';
        btnStay.addEventListener('click', closeModal);

        modalActions.appendChild(btnNew);
        modalActions.appendChild(btnViewAll);
        modalActions.appendChild(btnStay);
        launchConfetti();
      } else {
        modalBox.classList.add('retry');
        resultIcon.textContent = '💡';
        resultTitle.textContent = '아쉬워요! 다시 도전!';
        resultDesc.textContent = result.description;

        const btnRetry = document.createElement('button');
        btnRetry.className = 'modal-btn primary-retry';
        btnRetry.textContent = '숫자 고치러 가기';
        btnRetry.addEventListener('click', closeModal);

        modalActions.appendChild(btnRetry);
      }

      resultModal.classList.add('open');
    }

    function closeModal() {
      resultModal.classList.remove('open');
    }

    btnComplete.addEventListener('click', () => {
      if (isChecking) return;

      const emptyIndex = values.findIndex(v => v === '');
      if (emptyIndex !== -1) {
        activeIndex = emptyIndex;
        replaceOnNextDigit = true;
        renderCards();
        showHelper(`${emptyIndex + 1}번째 칸이 비어 있어요! 숫자 6개를 모두 채워 주세요.`);
        return;
      }

      hideHelper();
      isChecking = true;
      btnComplete.disabled = true;
      btnComplete.textContent = '규칙 확인 중...';

      const cards = document.querySelectorAll('.num-card');
      cards.forEach((card, idx) => {
        setTimeout(() => {
          card.classList.add('checking');
        }, idx * 70);
      });

      setTimeout(() => {
        cards.forEach(card => card.classList.remove('checking'));
        const nums = values.map(v => parseInt(v, 10));
        const result = evaluatePattern(nums);

        isChecking = false;
        btnComplete.disabled = false;
        btnComplete.textContent = '✨ 규칙 완성!';

        openResultModal(nums, result);
      }, 650);
    });

    updateHistoryBadge();
    renderCards();
  </script>
</body>
</html>
